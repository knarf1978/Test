<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grok Bot Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2324384c'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --bg:#e7dfd2; --panel:#fbf7f1; --ink:#1c1915; --muted:#6e675e; --line:#e3d6c4;
  --green:#2f7d5a; --yellow:#c4842a; --red:#a33b3b; --blue:#2a5278; --grey:#8a8175;
  --shadow:0 10px 28px rgba(40,28,16,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}

#pill{
  flex:0 0 auto;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:22px;align-items:center;justify-content:center;
  padding:10px 18px;font-size:13px;font-weight:650;
}
#pill .c{display:flex;align-items:center;gap:7px}
#pill .d{width:8px;height:8px;border-radius:50%;display:inline-block}
#pill .d.w{background:var(--green)} #pill .d.wait{background:var(--yellow)}
#pill .d.err{background:var(--red)} #pill .d.rest{background:var(--grey)}

#app{flex:1;display:flex;min-height:0}
.panel{
  width:300px;flex:0 0 auto;background:var(--panel);overflow:auto;
  display:flex;flex-direction:column;min-height:0;
}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.panel .head{padding:16px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.panel .head h1{margin:0;font-size:18px;letter-spacing:-.02em}
.panel .head .sub{margin-top:4px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,125,90,.18)}
.panel .body{padding:12px 14px 16px;overflow:auto;flex:1 1 auto}
.sec{margin:12px 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.sec .chev{transition:transform .2s}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sec-body.collapsed{display:none}
.floor-row,.wait-row,.bot-card,.act-row,.fin-row,.rt-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;
}
.floor-row:hover,.wait-row:hover,.bot-card:hover,.fin-row:hover{background:#f3ece2}
.floor-row.active{background:#e7eef5}
.floor-swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.floor-meta{flex:1;min-width:0}
.floor-meta .n{font-size:13px;font-weight:650}
.floor-meta .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:700;background:#efe6d8;border-radius:999px;padding:2px 8px;color:#3d3428}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:#2a241c;color:#fbf7f1;border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:650;
}
.btn:hover{background:#43392c}
.btn.sm{padding:5px 10px;font-size:11px}
.icon2d{width:28px;height:28px;flex:0 0 auto;display:grid;place-items:center}
.icon2d svg{width:24px;height:24px;display:block}
.bot-card .info{flex:1;min-width:0}
.bot-card .info .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bot-card .info .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.status-dot.working{background:var(--green)}
.status-dot.waiting_user{background:var(--yellow)}
.status-dot.error{background:var(--red)}
.status-dot.done,.status-dot.idle{background:var(--grey)}
.act-row{cursor:default;align-items:flex-start;padding:7px 8px}
.act-row .t{font-size:10px;color:#9a9084;width:46px;flex:0 0 auto;padding-top:2px}
.act-row .txt{font-size:12px;line-height:1.35}
.act-row .txt b{font-weight:700}
#right .head{padding:0;border:0}
#right .floor-band{
  padding:16px 18px 14px;color:#f7f3ea;
  background:linear-gradient(145deg,#243e56,#1c3a36);
}
#right .floor-band .kicker{font-size:11px;opacity:.85;font-weight:600}
#right .floor-band h2{margin:2px 0 0;font-size:18px}
#right .floor-band .meta{margin-top:4px;font-size:12px;opacity:.9}
.usage{padding:14px 16px 16px;border-top:1px solid var(--line);flex:0 0 auto}
.usage .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:650;margin-bottom:8px}
.bar{height:12px;background:#efe6d8;border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#2a5278,#2f7d5a);border-radius:999px;width:0}
.lb{margin-top:10px}
.lb .row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#3d3428}
.lb .row span:last-child{font-weight:700}

#stage{flex:1;position:relative;min-width:0;background:#d5e2ee;touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none}
.empty-hint{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  color:#4e5c68;font-size:14px;text-align:center;z-index:4;pointer-events:none;
  background:rgba(251,247,241,.88);padding:10px 14px;border-radius:12px;
}
#bubbleLayer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.bub{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.leader{position:absolute;left:0;top:0;height:2px;background:rgba(28,25,21,.55);transform-origin:0 50%;border-radius:2px;pointer-events:none}
.hud-bubble{
  position:absolute;left:0;top:0;transform:translate(-50%,-100%);
  background:#fbf7f1;color:#1c1915;border-radius:12px;padding:7px 11px;
  font-size:12px;font-weight:700;line-height:1.25;
  box-shadow:0 8px 22px rgba(40,28,16,.16),0 0 0 1px rgba(40,28,16,.06);
  white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  animation:hudpop .3s cubic-bezier(.2,1.4,.4,1) 1 both;
}
.hud-bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg)}
.bub.lifted .hud-bubble::after{display:none}
.hud-bubble.need{white-space:normal;text-align:center;min-width:140px;padding:10px 12px;pointer-events:auto;overflow:visible}
.hud-bubble.need .who{margin-bottom:7px;font-size:12px}
.hud-bubble .btn{pointer-events:auto}
.hud-bubble.check{background:#2a241c;color:#fbf7f1}
.hud-bubble.ask{background:#2a241c;color:#fbf7f1;font-size:13px}
.hud-bubble.reply{background:#fbf7f1;color:#1c1915;font-size:13px;box-shadow:0 8px 22px rgba(40,28,16,.2),0 0 0 2px #2f7d5a}
.hud-bubble.err{color:#a33b3b}
@keyframes hudpop{0%{transform:translate(-50%,-92%) scale(.85)}100%{transform:translate(-50%,-100%) scale(1)}}

#camBtns,#zoomCtl{position:absolute;z-index:6;display:flex;gap:6px;flex-wrap:wrap}
#camBtns{left:12px;bottom:12px}
#zoomCtl{right:12px;bottom:12px}
#camBtns button,#zoomCtl button{
  min-width:40px;min-height:40px;border:0;border-radius:999px;
  background:rgba(251,247,241,.94);color:#1c1915;font-size:13px;font-weight:700;
  padding:0 12px;box-shadow:0 6px 16px rgba(40,28,16,.12),0 0 0 1px rgba(40,28,16,.06);
}
#zoomCtl button{background:#2a241c;color:#fbf7f1;font-size:16px}
#zoomCtl button.fit{background:#fbf7f1;color:#1c1915;font-size:13px}
#zoomCtl button.fit.on{background:#e7eef5;color:#1e3f5c;box-shadow:0 0 0 2px #2a5278}

#msg{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;
  background:#fbf7f1;border-radius:16px;box-shadow:var(--shadow);padding:22px 26px;max-width:420px;
  text-align:center;display:none;font-size:14px;line-height:1.45;
}
#msg.show{display:block}
#msg b{display:block;font-size:16px;margin-bottom:6px}

@media (max-width:860px){
  body{height:auto;min-height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
  #pill{
    position:sticky;top:0;justify-content:space-around;gap:8px;padding:12px 8px;font-size:12px;
  }
  #pill .c{gap:5px;flex-direction:column;align-items:center;text-align:center;font-size:11px}
  #app{flex:none;flex-direction:column}
  #stage{order:1;flex:none;height:62vh;min-height:280px}
  #left{order:2} #right{order:3}
  .panel{width:auto;border:0;border-top:1px solid var(--line);overflow:visible}
  .panel .body{overflow:visible}
  .floor-row,.wait-row,.bot-card,.fin-row,.rt-row,.act-row{padding:12px;min-height:44px}
  .btn,.btn.sm{min-height:40px;padding:10px 14px;font-size:13px}
  .sec{padding:10px 4px;font-size:12px;min-height:40px}
  #camBtns button,#zoomCtl button{min-width:44px;min-height:44px}
  #msg{left:12px;right:12px;top:auto;bottom:18px;transform:none;max-width:none}
}
@media (max-width:399px){
  #stage{height:56vh;min-height:240px}
  #pill{gap:4px;padding:10px 4px;font-size:10px}
}
</style>
</head>
<body>
<div id="pill" aria-live="polite">
  <div class="c"><span class="d w"></span><span id="c-work">0 working</span></div>
  <div class="c"><span class="d wait"></span><span id="c-wait">0 waiting</span></div>
  <div class="c"><span class="d err"></span><span id="c-err">0 errors</span></div>
  <div class="c"><span class="d rest"></span><span id="c-rest">0 resting</span></div>
</div>
<div id="app">
<aside id="left" class="panel">
  <div class="head">
    <h1>Grok Bot Office</h1>
    <div class="sub"><span class="live-dot" id="liveDot"></span><span id="liveLabel">Live</span> · <span id="clock">--:--</span></div>
  </div>
  <div class="body">
    <div class="sec" data-sec="floors">Teams <span class="chev">▾</span></div>
    <div class="sec-body" id="floorList"></div>
    <div class="sec" data-sec="waiting">Waiting on me <span class="chev">▾</span></div>
    <div class="sec-body" id="waitList"></div>
    <div class="sec collapsed" data-sec="finished">Finished <span class="chev">▾</span></div>
    <div class="sec-body collapsed" id="finList"></div>
    <div class="sec collapsed" data-sec="routines">Routines <span class="chev">▾</span></div>
    <div class="sec-body collapsed" id="rtList"></div>
    <div class="sec" data-sec="activity">Activity <span class="chev">▾</span></div>
    <div class="sec-body" id="actList"></div>
  </div>
</aside>
<div id="stage">
  <canvas id="cv" aria-label="Three dimensional office"></canvas>
  <div class="empty-hint" id="emptyHint" style="display:none">No bots yet — waiting for the first status line.</div>
  <div id="bubbleLayer" aria-hidden="false"></div>
  <div id="camBtns" aria-label="Camera">
    <button type="button" id="camOrbit">Orbit</button>
    <button type="button" id="camTop">Top</button>
    <button type="button" id="camFollow">Follow</button>
  </div>
  <div id="zoomCtl" aria-label="Zoom">
    <button type="button" id="zoomOut" title="Zoom out">−</button>
    <button type="button" id="zoomFit" class="fit on" title="Show the whole office">Fit</button>
    <button type="button" id="zoomIn" title="Zoom in">+</button>
  </div>
</div>
<aside id="right" class="panel">
  <div class="head">
    <div class="floor-band" id="floorBand">
      <div class="kicker">Office roster</div>
      <h2 id="rbName">All bots</h2>
      <div class="meta" id="rbMeta">—</div>
    </div>
  </div>
  <div class="body" id="botCards"></div>
  <div class="usage">
    <div class="lab"><span>Weekly limit</span><span id="usagePct">—</span></div>
    <div class="bar"><i id="usageBar"></i></div>
    <div class="lab" style="margin-top:8px;font-weight:500;color:var(--muted)"><span id="usageReset">Resets —</span></div>
    <div class="lb" id="usageLB"></div>
  </div>
</aside>
</div>
<div id="msg"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const FLOOR_COLORS = ['#5b8def','#14C16F','#FD690F','#9B59B6','#E5484D','#1E86FC','#F59312'];
const SUPERVISOR = 'Tinker';
const PALETTE = [0x2f5d50,0x1e4d7b,0x8a5a3b,0x3e5f4a,0x234e70,0x6b4c3b,0x1f6f5b,0x3d4f73];
const WALK_SPEED = 5.1;

const st = {roster:[], groups:{}, chat:{}, looks:{}, status:{}, routines:{}, usage:null, activity:[], assignAt:{}};
const seenVisitIds = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem('hqSeenVisits')||'[]')); }catch(e){ return new Set(); } })();
function saveSeenVisits(){ try{ localStorage.setItem('hqSeenVisits', JSON.stringify(Array.from(seenVisitIds).slice(-300))); }catch(e){} }
const taskQueue = [];
const heldNames = new Map();
const agents = {};
const idle = {};
const captions = {};
const bubbles = {};
const deskSlots = {};
const spots = {coffee:[], cards:[], gym:[], cooler:[], couch:[], whiteboard:[]};
const screens = {};
const layoutNotes = [];
const tk = {task:null, returnHome:false, dwellUntil:0};
const cam = {mode:'fit'};
let selectedTeam = null;
let selectedName = SUPERVISOR;
let camMode = 'orbit';
let sceneSig = '';
let metrics = null;
let grid = null;
let tinkerSeat = {x:5, z:7, yaw:Math.PI};
let cardCenter = {x:10, z:24, y:1.02};
let loadSeq = 0;
const pageLoadAt = Date.now();

const canvas = document.getElementById('cv');
const stage = document.getElementById('stage');
let renderer, scene, camera, controls, world, actorRoot, sun, plaza;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hashName(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function topicNow(){ return DEMO ? '' : location.hash.slice(1); }
function isNarrow(){ return window.matchMedia('(max-width:860px)').matches; }
function workers(){ return st.roster.filter(b=>b!==SUPERVISOR); }
function resolveWorkerName(name){ const l=String(name||'').toLowerCase(); return workers().find(w=>w.toLowerCase()===l)||null; }
function truncateStep(step){ const s=String(step||'').trim(); if(!s) return 'all good 👍'; return s.length>40 ? s.slice(0,37)+'...' : s; }
function statusLabel(s){ return ({working:'Working',waiting_user:'Waiting',error:'Error',done:'Done',idle:'Idle'})[s]||(s||'Unknown'); }
function isDeskStatus(s){ return s==='working'||s==='waiting_user'||s==='error'; }
function effStatus(name, ignoreAssign){
  const s = st.status[name], a = st.assignAt[name];
  if(!ignoreAssign && a && (!s || a.time >= s.time)) return {status:'working', step:a.task||'new job from Tinker', time:a.time};
  return s ? {status:s.status, step:s.step||'', time:s.time} : {status:'', step:'', time:0};
}
function shouldBeAtDesk(name){
  if(heldNames.has(name)) return true;
  return isDeskStatus(effStatus(name).status);
}
function showMsg(title, body){ const el=$('msg'); el.innerHTML=`<b>${esc(title)}</b>${esc(body)}`; el.classList.add('show'); }
function hideMsg(){ $('msg').classList.remove('show'); }
function nyTime(ts){ try{return new Date(ts*1000).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return '--:--'} }
function nyClock(){ try{return new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return '--:--'} }
function resetsIn(iso){
  if(!iso) return '—'; const t=new Date(iso).getTime()-Date.now();
  if(isNaN(t)) return '—'; if(t<=0) return 'soon';
  const d=Math.floor(t/86400000), h=Math.floor((t%86400000)/3600000);
  return d>0 ? `${d}d ${h}h` : `${h}h`;
}
function shapeSVG(shape, color, size){
  const c = color || '#8a8175'; const s = size || 28;
  if(shape==='star4') return `<svg viewBox="0 0 28 28" width="${s}" height="${s}"><path fill="${esc(c)}" d="M14 1.5 L17.2 10.8 L27 14 L17.2 17.2 L14 26.5 L10.8 17.2 L1 14 L10.8 10.8 Z"/></svg>`;
  if(shape==='hexagon') return `<svg viewBox="0 0 28 28" width="${s}" height="${s}"><path fill="${esc(c)}" d="M14 2 L25 8.5 L25 19.5 L14 26 L3 19.5 L3 8.5 Z"/></svg>`;
  if(shape==='square') return `<svg viewBox="0 0 28 28" width="${s}" height="${s}"><rect x="4" y="4" width="20" height="20" rx="4" fill="${esc(c)}"/></svg>`;
  if(shape==='triangle') return `<svg viewBox="0 0 28 28" width="${s}" height="${s}"><path fill="${esc(c)}" d="M14 3 L26 24 L2 24 Z"/></svg>`;
  return `<svg viewBox="0 0 28 28" width="${s}" height="${s}"><path fill="${esc(c)}" d="M14 2 C14 2 24 12 24 17.5 A10 10 0 0 1 4 17.5 C4 12 14 2 14 2 Z"/></svg>`;
}
function apply(d, time){
  if(d.roster) st.roster = d.roster.slice();
  if(d.groups) Object.assign(st.groups, d.groups);
  if(d.chat) Object.assign(st.chat, d.chat);
  if(d.looks) Object.assign(st.looks, d.looks);
  if(d.routines) st.routines[d.routines.bot] = d.routines.items;
  if(d.type==='usage') st.usage = d;
  if(d.bot && d.status){
    st.status[d.bot] = {...d, time};
    if(!st.roster.includes(d.bot)) st.roster.push(d.bot);
    st.activity.unshift({bot:d.bot, status:d.status, step:d.step||'', time});
    if(st.activity.length>40) st.activity.length=40;
  }
}
function teamsMap(){
  const teams = {};
  for(const b of st.roster){ const g = st.groups[b] || 'Other'; (teams[g]=teams[g]||[]).push(b); }
  const prefer = ['Ops','Testing'];
  const keys = Object.keys(teams).sort((a,b)=>{
    if(a==='Other') return 1; if(b==='Other') return -1;
    const ia=prefer.indexOf(a), ib=prefer.indexOf(b);
    if(ia>=0||ib>=0) return (ia<0?99:ia)-(ib<0?99:ib);
    return a.localeCompare(b);
  });
  return {teams, keys};
}
function workerOrder(){
  const {teams, keys} = teamsMap();
  const names = [];
  keys.forEach(g => (teams[g]||[]).filter(b=>b!==SUPERVISOR).forEach(n => names.push(n)));
  return names;
}
function counts(){
  let w=0,wait=0,err=0,rest=0;
  for(const b of st.roster){ const s=effStatus(b).status;
    if(s==='working') w++; else if(s==='waiting_user') wait++; else if(s==='error') err++; else rest++; }
  return {w,wait,err,rest};
}
function resetState(){
  for(const k of ['groups','chat','looks','status','routines','assignAt']) st[k]={};
  st.roster=[]; st.usage=null; st.activity=[];
}

/* Topic is read from the URL hash only. This file never names a feed, channel, or key. */
function feedTargets(v){
  const list = Array.isArray(v) ? v : [v];
  const out = [];
  for(const x of list){
    if(String(x).toLowerCase()==='all') workers().forEach(w=>{ if(!out.includes(w)) out.push(w); });
    else { const n = resolveWorkerName(x); if(n && !out.includes(n)) out.push(n); }
  }
  return out;
}
function considerTinkerActions(d, msgId, time){
  if(!d || d.bot !== SUPERVISOR) return;
  const ts = Number(time) || Math.floor(Date.now()/1000);
  const msgMs = ts * 1000;
  const fresh = !(msgMs && msgMs < pageLoadAt - 2*60*1000);
  if(d.visit!=null && d.visit!==''){
    const id = msgId || ('t' + String(time||'') + ':' + String(d.visit));
    const targets = feedTargets(d.visit);
    targets.forEach(n=> st.activity.unshift({bot:SUPERVISOR, kind:'visit', target:n, time:ts}));
    if(targets.length && !seenVisitIds.has(id)){
      seenVisitIds.add(id); saveSeenVisits();
      if(fresh) targets.forEach(n=>{ taskQueue.push({type:'visit', target:n}); heldNames.set(n,(heldNames.get(n)||0)+1); });
    }
  }
  if(d.assign!=null && d.assign!==''){
    const id = (msgId ? msgId + ':assign' : ('a' + String(time||'') + ':' + JSON.stringify(d.assign)));
    const targets = feedTargets(d.assign);
    targets.forEach(n=>{
      st.activity.unshift({bot:SUPERVISOR, kind:'assign', target:n, time:ts});
      const prev = st.assignAt[n];
      if(!prev || prev.time <= ts) st.assignAt[n] = {time:ts, task:d.task || d.job || ''};
    });
    if(targets.length && !seenVisitIds.has(id)){
      seenVisitIds.add(id); saveSeenVisits();
      if(fresh) targets.forEach(n=>{ taskQueue.push({type:'assign', target:n}); heldNames.set(n,(heldNames.get(n)||0)+1); });
    }
  }
  if(st.activity.length>40) st.activity.length=40;
}
function considerStatusCheck(d, prev, msgId, time){
  if(!d || !d.bot || d.bot===SUPERVISOR || !d.status) return;
  if(!isDeskStatus(d.status) || d.status===prev) return;
  const id = 'chk:' + (msgId || (String(time) + ':' + d.bot + ':' + d.status));
  if(seenVisitIds.has(id)) return;
  seenVisitIds.add(id); saveSeenVisits();
  const ts = (Number(time)||0) * 1000;
  if(ts && ts < pageLoadAt - 20*1000) return;
  if(taskQueue.some(q=>q.type==='check' && q.target===d.bot)) return;
  taskQueue.push({type:'check', target:d.bot});
}
function ingestLines(lines){
  resetState();
  for(const line of lines){
    if(!line) continue;
    let m; try{ m=JSON.parse(line); }catch(e){ continue; }
    if(m.event && m.event!=='message') continue;
    if(m.event==='message'){
      try{
        const payload = JSON.parse(m.message);
        const t = m.time || Math.floor(Date.now()/1000);
        const prevStatus = payload && payload.bot ? ((st.status[payload.bot]||{}).status || '') : '';
        apply(payload, t);
        considerTinkerActions(payload, m.id, t);
        considerStatusCheck(payload, prevStatus, m.id, t);
      }catch(e){}
    }
  }
}

function clearGroup(root){
  const seenM = new Set(), seenT = new Set();
  for(const obj of [...root.children]){
    obj.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      const mats = o.material==null ? [] : (Array.isArray(o.material)?o.material:[o.material]);
      for(const m of mats){
        if(seenM.has(m)) continue;
        seenM.add(m);
        if(m.map && !seenT.has(m.map)){ seenT.add(m.map); m.map.dispose(); }
        m.dispose();
      }
    });
    root.remove(obj);
  }
}

function segments(start,end,gaps){
  const g=(gaps||[]).map(p=>[Math.min(p[0],p[1]), Math.max(p[0],p[1])]).sort((a,b)=>a[0]-b[0]);
  const out=[]; let c=start;
  for(const [a,b] of g){
    if(a>c) out.push([c, Math.min(a,end)]);
    c=Math.max(c,b);
    if(c>=end) break;
  }
  if(c<end) out.push([c,end]);
  return out.filter(([a,b])=>b-a>0.2);
}

function computeMetrics(names){

function worldToCell(x,z){
  return {c:Math.floor((x-grid.originX)/grid.cell), r:Math.floor((z-grid.originZ)/grid.cell)};
}
function cellCenter(c,r){ return {x:grid.originX+(c+0.5)*grid.cell, z:grid.originZ+(r+0.5)*grid.cell}; }
function freeCell(c,r){ return !!(grid && c>=0 && r>=0 && c<grid.cols && r<grid.rows && !grid.blocked[r][c]); }
function nearestFree(c,r){
  if(freeCell(c,r)) return {c,r};
  for(let rad=1; rad<=8; rad++){
    for(let dc=-rad; dc<=rad; dc++) for(let dr=-rad; dr<=rad; dr++){
      if(Math.max(Math.abs(dc),Math.abs(dr))!==rad) continue;
      if(freeCell(c+dc, r+dr)) return {c:c+dc, r:r+dr};
    }
  }
  return null;
}
function snapFree(x,z){
  const ideal=worldToCell(x,z);
  const n=nearestFree(ideal.c, ideal.r);
  if(!n) return {x,z};
  return cellCenter(n.c, n.r);
}
function lineFree(x0,z0,x1,z1){
  const dist=Math.hypot(x1-x0,z1-z0);
  const steps=Math.max(1, Math.ceil(dist/(grid.cell*0.35)));
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const c=worldToCell(x0+(x1-x0)*t, z0+(z1-z0)*t);
    if(!freeCell(c.c,c.r)) return false;
  }
  return true;
}
function smoothPath(pts){
  if(!pts || pts.length<=2) return pts||[];
  const out=[pts[0]];
  let anchor=0;
  for(let i=1;i<pts.length;i++){
    if(!lineFree(pts[anchor].x, pts[anchor].z, pts[i].x, pts[i].z)){
      out.push(pts[i-1]);
      anchor=i-1;
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function findPath(sx,sz,tx,tz){
  if(!grid) return null;
  let S=worldToCell(sx,sz), T=worldToCell(tx,tz);
  if(!freeCell(S.c,S.r)){ const n=nearestFree(S.c,S.r); if(!n) return null; S=n; }
  if(!freeCell(T.c,T.r)){ const n=nearestFree(T.c,T.r); if(!n) return null; T=n; }
  const key=(c,r)=>r*grid.cols+c;
  const nodes=[{c:S.c,r:S.r,g:0,f:0,p:-1}];
  const best=new Map([[key(S.c,S.r),0]]);
  const open=[0];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(open.length){
    let bi=0;
    for(let i=1;i<open.length;i++) if(nodes[open[i]].f<nodes[open[bi]].f) bi=i;
    const ni=open[bi];
    open.splice(bi,1);
    const n=nodes[ni];
    if(n.c===T.c && n.r===T.r){
      const pts=[]; let i=ni;
      while(i>=0){ pts.push(cellCenter(nodes[i].c, nodes[i].r)); i=nodes[i].p; }
      pts.reverse();
      return smoothPath(pts);
    }
    for(const [dc,dr] of dirs){
      const nc=n.c+dc, nr=n.r+dr;
      if(!freeCell(nc,nr)) continue;
      const g=n.g+1, k=key(nc,nr);
      if(best.has(k) && best.get(k)<=g) continue;
      best.set(k,g);
      nodes.push({c:nc,r:nr,g,f:g+Math.abs(nc-T.c)+Math.abs(nr-T.r),p:ni});
      open.push(nodes.length-1);
    }
  }
  return null;
}
function auditPaths(){
  const fails=[];
  const seats=Object.values(deskSlots).map(d=>({name:d.name, x:d.seatX, z:d.seatZ}));
  const all=[];
  for(const kind of Object.keys(spots)) spots[kind].forEach((s,i)=>all.push({kind,i,x:s.x,z:s.z}));
  for(const s of all){
    if(!findPath(tinkerSeat.x, tinkerSeat.z, s.x, s.z)) fails.push('home -> '+s.kind+':'+s.i);
    for(const d of seats){
      if(!findPath(s.x, s.z, d.x, d.z)) fails.push(s.kind+':'+s.i+' -> '+d.name);
    }
  }
  for(const d of seats){
    if(!findPath(tinkerSeat.x, tinkerSeat.z, d.x, d.z)) fails.push('home -> desk '+d.name);
    if(!findPath(d.x, d.z, deskSlots[d.name].besideX, deskSlots[d.name].besideZ)) fails.push('seat -> beside '+d.name);
  }
  return fails;
}

  g.beginPath();

  g.arcTo(x+w,y+h,x,y+h,r);

}
function disposeGroup(root){
  const seen=new Set();
  root.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    const mats=o.material==null?[]:(Array.isArray(o.material)?o.material:[o.material]);
    for(const m of mats){
      if(seen.has(m)) continue;
      seen.add(m);
      if(m.map) m.map.dispose();
      m.dispose();
    }
  });
}

function placeAt(bot, loc){
  bot.group.position.set(loc.x, 0, loc.z);
  bot.group.rotation.y=loc.yaw||0;
  bot.dest={key:loc.key, x:loc.x, z:loc.z};
  bot.pendingLoc=loc;
  bot.loc=loc;
  bot.path=[];
  bot.moving=false;
  bot.atDest=true;
  bot.placed=true;
}
function nudgeOut(bot){
  const c=worldToCell(bot.group.position.x, bot.group.position.z);
  if(freeCell(c.c,c.r)) return;
  const n=nearestFree(c.c,c.r);
  if(!n) return;
  const p=cellCenter(n.c,n.r);
  bot.group.position.x=p.x; bot.group.position.z=p.z;
}
function goTo(bot, loc){
  if(!loc) return;
  if(!bot.placed){ placeAt(bot, loc); return; }
  if(bot.dest && bot.dest.key===loc.key && Math.abs(bot.dest.x-loc.x)<0.08 && Math.abs(bot.dest.z-loc.z)<0.08 && (bot.moving||bot.atDest)) return;
  nudgeOut(bot);
  const dist=Math.hypot(bot.group.position.x-loc.x, bot.group.position.z-loc.z);
  bot.pendingLoc=loc;
  bot.dest={key:loc.key, x:loc.x, z:loc.z};
  if(dist<0.35){
    bot.path=[]; bot.moving=false; bot.atDest=true; bot.loc=loc;
    bot.group.position.x=loc.x; bot.group.position.z=loc.z; bot.group.rotation.y=loc.yaw||0;
    return;
  }
  const path=findPath(bot.group.position.x, bot.group.position.z, loc.x, loc.z);
  if(!path){ bot.dest=null; bot.moving=false; return; }
  if(path.length && Math.hypot(path[path.length-1].x-loc.x, path[path.length-1].z-loc.z)>0.05) path.push({x:loc.x,z:loc.z});
  bot.path=path;
  bot.moving=path.length>0;
  bot.atDest=false;
}
function faceToward(bot, yaw, dt){
  let d=yaw-bot.group.rotation.y;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  const step=Math.min(1, dt*7);
  bot.group.rotation.y += d*step;
}
function stepAgent(bot, dt){
  if(!bot.path || !bot.path.length){
    bot.moving=false;
    if(bot.pendingLoc && !bot.atDest){
      bot.atDest=true; bot.loc=bot.pendingLoc;
    }
    if(bot.atDest && bot.loc) faceToward(bot, bot.loc.yaw||0, dt);
    return;
  }
  bot.moving=true; bot.atDest=false;
  let step=WALK_SPEED*dt;
  while(step>0 && bot.path.length){
    const t=bot.path[0];
    const dx=t.x-bot.group.position.x, dz=t.z-bot.group.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<1e-4){ bot.path.shift(); continue; }
    faceToward(bot, Math.atan2(dx,dz), dt);
    if(dist<=step){ bot.group.position.x=t.x; bot.group.position.z=t.z; bot.path.shift(); step-=dist; }
    else { bot.group.position.x+=dx/dist*step; bot.group.position.z+=dz/dist*step; step=0; }
  }
  if(!bot.path.length){
    bot.moving=false; bot.atDest=true;
    if(bot.pendingLoc) bot.loc=bot.pendingLoc;
  }
}

function spotTaken(kind, index, except){

function takeSpot(kind, name){
  if(kind==='desk') return name===SUPERVISOR ? 0 : -1;
  const list=spots[kind]||[];
  for(let i=0;i<list.length;i++){
    if(kind==='cards' && i===0 && name!==SUPERVISOR) continue;
    if(kind==='cards' && name===SUPERVISOR && i!==0) continue;
    if(spotTaken(kind, i, name)) continue;
    return i;
  }
  return -1;
}
function weightList(name){
  const list=[];
  const add=(k,w)=>{ for(let i=0;i<w;i++) list.push(k); };
  const cardPlayers=Object.values(idle).filter(p=>p.kind==='cards').length;
  add('cards', cardPlayers?4:2);
  add('cooler', Object.values(idle).some(p=>p.kind==='cooler')?3:1);
  add('gym',2); add('coffee',1); add('couch',1); add('whiteboard',1);
  if(name===SUPERVISOR){ add('cards',3); add('desk',3); }

function pickIdle(name, now, prefer){
  const prev=idle[name];

  const order=[];
  if(prefer) order.push(prefer);
  const weighted=weightList(name).filter(k=>!prev || k!==prev.kind);
  for(let i=weighted.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=weighted[i]; weighted[i]=weighted[j]; weighted[j]=tmp;
  }
  order.push(...weighted);
  if(prev) order.push(prev.kind);
  for(const kind of order){
    const spot=takeSpot(kind, name);
    if(spot>=0){
      idle[name]={kind, spot, until:now+12000+Math.random()*16000};
      return idle[name];
    }
  }

}

function tinkerTick(now){
  const T=agents[SUPERVISOR]; if(!T || !T.placed) return;
  if(!tk.task){
    if(taskQueue.length){
      let qi=taskQueue.findIndex(q=>q.type!=='check'); if(qi<0) qi=0;
      const t=taskQueue.splice(qi,1)[0];
      if(!agents[t.target]){ releaseHold(t.target); return; }
      tk.task={...t, phase:'walk', tries:0};

    }

  }
  const t=tk.task, A=agents[t.target];
  if(!A){ endTask(); return; }
  if(t.type==='check' && t.phase==='walk' && taskQueue.some(q=>q.type!=='check')){
    taskQueue.push({type:'check', target:t.target}); tk.task=null; return;
  }
  if(t.phase==='walk'){
    if(t.type==='check' && !isDeskStatus(effStatus(t.target).status)){ endTask(); return; }
    const want=deskBesideLoc(t.target);
    if(!want){ endTask(); return; }
    goTo(T, want);
    if(!T.dest || T.dest.key!==want.key){ if(++t.tries>12) endTask(); return; }
    if(T.moving || A.moving || !T.atDest || !A.atDest) return;
    t.phase='ask'; t.until=now+3000;
    setCaption(SUPERVISOR, t.type==='assign' ? 'new job for you!' : t.type==='visit' ? 'you ok?' : '👀 checking…', t.type==='check' ? 'check' : 'ask');
    return;
  }
  if(t.phase==='ask'){
    if(now<t.until) return;
    if(t.type==='check'){ endTask(); return; }
    t.phase='reply'; t.until=now+(t.type==='assign'?2000:3000);
    setCaption(t.target, t.type==='assign' ? 'on it!' : truncateStep(effStatus(t.target).step), 'reply');
    return;
  }
  if(t.phase==='reply'){
    if(now<t.until) return;
    endTask();
  }
}

function resetRigPose(bot){
  bot.armL.pivot.rotation.set(0,0,0);
  bot.armR.pivot.rotation.set(0,0,0);
  bot.armL.elbow.rotation.set(-0.18,0,0);

  bot.legL.hip.rotation.set(0,0,0);
  bot.legR.hip.rotation.set(0,0,0);
  bot.legL.knee.rotation.set(0,0,0);
  bot.legR.knee.rotation.set(0,0,0);

function applySit(bot){

function pose(bot, dt, now){
  if(!bot.armL) return;
  resetRigPose(bot);
  const ph=bot.phase0||0;
  if(bot.moving){
    bot.phase=(bot.phase||0)+dt*8;
    const s=Math.sin(bot.phase);
    bot.legL.hip.rotation.x=s*0.65;
    bot.legR.hip.rotation.x=-s*0.65;
    bot.legL.knee.rotation.x=Math.max(0,-s)*0.85;
    bot.legR.knee.rotation.x=Math.max(0,s)*0.85;
    bot.armL.pivot.rotation.x=-s*0.75;
    bot.armR.pivot.rotation.x=s*0.75;
    bot.armL.elbow.rotation.x=-0.35;
    bot.armR.elbow.rotation.x=-0.35;
    bot.group.position.y=Math.abs(Math.cos(bot.phase))*0.045;
  } else {
    const act=bot.loc && bot.atDest ? bot.loc.activity : 'stand';
    const typing=act==='desk' && !heldNames.has(bot.name) && effStatus(bot.name, false).status==='working' && (bot.name!==SUPERVISOR || (bot.dest&&bot.dest.key==='home'));
    const deskTyping = act==='desk' && effStatus(bot.name, heldNames.has(bot.name)).status==='working';
    switch(act){
      case 'desk': {
        applySit(bot);
        if(deskTyping){
          bot.armL.pivot.rotation.x=-0.55;
          bot.armR.pivot.rotation.x=-0.5;
          bot.armL.elbow.rotation.x=-0.9+Math.sin(now/140+ph)*0.28;
          bot.armR.elbow.rotation.x=-0.85+Math.sin(now/110+ph)*0.28;
        } else {
          bot.armL.pivot.rotation.x=-0.35;
          bot.armR.pivot.rotation.x=-0.35;
          bot.armL.elbow.rotation.x=-0.4;
          bot.armR.elbow.rotation.x=-0.4;
        }
        break;
      }
      case 'cards': {
        applySit(bot);
        const s=Math.sin(now/220+ph);
        bot.armL.pivot.rotation.x=-0.7;
        bot.armR.pivot.rotation.x=-0.85+s*0.45;
        bot.armL.elbow.rotation.x=-0.8;
        bot.armR.elbow.rotation.x=-0.3+s*0.5;
        break;
      }
      case 'couch': {
        applySit(bot);
        bot.armL.pivot.rotation.x=-0.95;
        bot.armR.pivot.rotation.x=-0.9;
        bot.armL.elbow.rotation.x=-1.05;
        bot.armR.elbow.rotation.x=-0.85+Math.sin(now/260+ph)*0.35;
        bot.props.book.visible=true;
        bot.props.book.rotation.z=Math.sin(now/260+ph)*0.08;
        break;
      }
      case 'gym': {
        const kind=bot.loc.workout||'jacks';
        if(kind==='squat'){
          const s=(Math.sin(now/320+ph)+1)/2;
          bot.legL.hip.rotation.x=-1.0*s;
          bot.legR.hip.rotation.x=-1.0*s;
          bot.legL.knee.rotation.x=1.35*s;
          bot.legR.knee.rotation.x=1.35*s;
          bot.group.position.y=-0.32*s;
          bot.armL.pivot.rotation.x=-0.7;
          bot.armR.pivot.rotation.x=-0.7;
          bot.armL.elbow.rotation.x=-0.5;
          bot.armR.elbow.rotation.x=-0.5;
        } else if(kind==='curl'){
          const s=(Math.sin(now/200+ph)+1)/2;
          bot.armL.pivot.rotation.x=-0.25;
          bot.armR.pivot.rotation.x=-0.25;
          bot.armL.elbow.rotation.x=-0.15-s*1.35;
          bot.armR.elbow.rotation.x=-0.15-s*1.35;
          bot.props.bellL.visible=true;
          bot.props.bellR.visible=true;
        } else {
          const s=(Math.sin(now/170+ph)+1)/2;
          bot.armL.pivot.rotation.z=-0.15-s*1.45;
          bot.armR.pivot.rotation.z=0.15+s*1.45;
          bot.legL.hip.rotation.z=-s*0.38;
          bot.legR.hip.rotation.z=s*0.38;

        }
        break;
      }
      case 'coffee': {
        bot.armR.pivot.rotation.x=-1.25;
        bot.armR.elbow.rotation.x=-0.35+Math.sin(now/240+ph)*0.25;
        bot.armL.pivot.rotation.x=-0.15;
        bot.props.cup.visible=true;
        break;
      }
      case 'cooler': {
        bot.armR.pivot.rotation.x=-0.45+Math.sin(now/380+ph)*0.4;
        bot.armR.elbow.rotation.x=-0.55;
        bot.armL.pivot.rotation.x=-0.2;
        bot.armL.elbow.rotation.x=-0.3;
        break;
      }
      case 'whiteboard': {
        bot.armR.pivot.rotation.x=-0.45;
        bot.armR.pivot.rotation.z=-0.35-Math.sin(now/200+ph)*0.7;
        bot.armR.elbow.rotation.x=-0.4+Math.sin(now/180+ph)*0.45;
        bot.props.marker.visible=true;
        bot.armL.pivot.rotation.x=-0.2;
        break;
      }
      case 'stand':
        bot.group.position.y=Math.sin(now/700+ph)*0.015;
        break;
      default: {
        const unexpected = act;

  }

}

        for(let k=0;k<=col%3;k++){
          const mesh=cardMesh(k===col%3?(col%2?'r':'b'):'back');
          mesh.position.set(px*(col-2)*0.38 - d.x*(0.15-k*0.05), 0.02+k*0.02, pz*(col-2)*0.38 - d.z*(0.15-k*0.05));
          root.add(mesh);
        }
      }
    } else if(seated.length>=2){
      seated.forEach(s=>{
        const d=spots.cards[s.spot].dir;
        const px=-d.z, pz=d.x;
        for(let k=-1;k<=1;k++){
          const mesh=cardMesh('back');
          mesh.position.set(d.x*0.95 + px*k*0.28, 0.03, d.z*0.95 + pz*k*0.28);
          mesh.rotation.y=k*0.2;
          root.add(mesh);
        }
      });
    }
    return;
  }
  if(now<cards.next || !seated.length) return;
  if(seated.length===1){
    const flip=root.children[root.children.length-1];
    if(flip){ flip.rotation.x = flip.rotation.x>1 ? 0 : Math.PI; }
    cards.next=now+1600;
    return;
  }
  const pl=seated[cards.turn%seated.length];
  const d=spots.cards[pl.spot].dir;
  const mesh=cardMesh(Math.random()<0.5?'r':'b');
  mesh.position.set(d.x*0.95, 0.2, d.z*0.95);
  mesh.userData.target=new THREE.Vector3((Math.random()-0.5)*0.3, 0.04+root.children.length*0.015, (Math.random()-0.5)*0.3);
  root.add(mesh);
  if(root.children.length>18){
    const old=root.children.find(ch=>ch.userData && ch.userData.target);
    if(old){ if(old.geometry) old.geometry.dispose(); root.remove(old); }
  }
  cards.turn++;
  cards.next=now+1400;
}
function animateCards(){
  const root=world && world.getObjectByName('cardLayer');
  if(!root) return;
  for(const ch of root.children){
    if(ch.userData && ch.userData.target) ch.position.lerp(ch.userData.target, 0.18);
  }
}

function bubbleSpec(name){
  const cap=captions[name];
  if(cap) return {key:cap.kind+'|'+cap.text, cls:cap.kind, html:esc(cap.text), prio: cap.kind==='reply'?5:cap.kind==='ask'?4:2};
  if(name===SUPERVISOR) return null;
  const e=effStatus(name), a=agents[name];
  if(e.status==='waiting_user'){
    const chat=st.chat[name]||'';
    return {key:'need|'+chat, cls:'need', html:`<div class="who">${esc(name)} needs you</div>`+(chat?`<a class="btn sm" href="${esc(chat)}">Open chat</a>`:''), prio:3};
  }
  if(e.status==='error' && e.step) return {key:'err|'+e.step, cls:'err', html:esc(e.step), prio:3};
  if(e.status==='working' && e.step && a && !a.moving && a.loc && a.loc.activity==='desk') return {key:'step|'+e.step, cls:'', html:esc(e.step), prio:1};
  return null;
}
const headScratch=new THREE.Vector3();
function headScreen(bot){
  headScratch.set(0, 2.45, 0);
  bot.group.localToWorld(headScratch);
  const v=headScratch.clone().project(camera);
  return v;
}
function dropBubble(n){
  const b=bubbles[n]; if(!b) return;
  b.wrap.remove(); b.leader.remove(); delete bubbles[n];
}
function placeBubbles(){
  const layer=$('bubbleLayer'); if(!layer) return;
  const rect=layer.getBoundingClientRect();
  const items=[];
  for(const n of Object.keys(bubbles)) if(!agents[n]) dropBubble(n);
  for(const n in agents){
    const spec=bubbleSpec(n);
    if(!spec){ dropBubble(n); continue; }
    let b=bubbles[n];
    if(!b){
      const wrap=document.createElement('div'); wrap.className='bub';
      const inner=document.createElement('div'); inner.className='hud-bubble';
      const leader=document.createElement('div'); leader.className='leader'; leader.style.display='none';
      wrap.dataset.bot=n; wrap.appendChild(inner);
      layer.appendChild(leader); layer.appendChild(wrap);
      b=bubbles[n]={wrap, inner, leader, key:null, w:0, h:0, off:null, lifted:false, z:'', behind:false};
    }
    if(b.key!==spec.key){
      b.key=spec.key;
      b.inner.className='hud-bubble'+(spec.cls?' '+spec.cls:'');
      b.inner.innerHTML=spec.html;
      b.w=b.inner.offsetWidth; b.h=b.inner.offsetHeight;
    }
    const v=headScreen(agents[n]);
    const behind=v.z< -1 || v.z>1;
    if(behind!==b.behind){
      b.behind=behind;
      const vis=behind?'hidden':'visible';
      b.wrap.style.visibility=vis; b.leader.style.visibility=vis;
    }
    if(behind) continue;
    const ax=(v.x*0.5+0.5)*rect.width;
    const ay=(-v.y*0.5+0.5)*rect.height - 6;
    items.push({n,b,prio:spec.prio,ax,ay});
  }
  items.sort((p,q)=>q.prio-p.prio || q.ay-p.ay);
  const placed=[];
  for(const it of items){
    const b=it.b, w=b.w||b.inner.offsetWidth, h=b.h||b.inner.offsetHeight;
    b.w=w; b.h=h;
    const x=Math.max(w/2+4, Math.min(rect.width-w/2-4, it.ax));
    let bottom=it.ay;
    for(let g=0;g<24;g++){
      const hit=placed.find(p=>x-w/2<p.r+4 && x+w/2>p.l-4 && bottom-h<p.b+4 && bottom>p.t-4);
      if(!hit) break;
      bottom=hit.t-6;
    }
    const off=bottom-it.ay;
    let next=off;
    if(b.off!=null && b.off<off-0.5){
      const cand=b.off+(off-b.off)*0.35, cb=it.ay+cand;
      if(!placed.some(p=>x-w/2<p.r+4 && x+w/2>p.l-4 && cb-h<p.b+4 && cb>p.t-4)) next=cand;
    }
    b.off=next;
    const by=it.ay+b.off;
    placed.push({l:x-w/2, r:x+w/2, t:by-h, b:by});
    b.wrap.style.transform=`translate3d(${x.toFixed(1)}px,${by.toFixed(1)}px,0)`;
    const z=String(10+it.prio*10);
    if(b.z!==z){ b.z=z; b.wrap.style.zIndex=z; b.leader.style.zIndex=String(9+it.prio*10); }
    const lifted=(it.ay-by)>8 || Math.abs(x-it.ax)>14;
    if(lifted!==b.lifted){ b.lifted=lifted; b.wrap.classList.toggle('lifted', lifted); b.leader.style.display=lifted?'block':'none'; }
    if(lifted){
      const dx=x-it.ax, dy=by-it.ay, len=Math.hypot(dx,dy);
      b.leader.style.width=len.toFixed(1)+'px';
      b.leader.style.transform=`translate3d(${it.ax.toFixed(1)}px,${(it.ay-1).toFixed(1)}px,0) rotate(${Math.atan2(dy,dx)}rad)`;
    }
  }
}

function render(){
  const rebuilt=ensureWorld();
  syncActors();
  if((rebuilt || cam.mode==='fit') && cam.mode==='fit') fitCamera();
  renderPanels();
  updateMonitors();
}

function fitCamera(){
  cam.mode='fit';
  camMode='orbit';
  const box=new THREE.Box3().setFromObject(world);
  if(box.isEmpty()) return;
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const fov=camera.fov*Math.PI/180;
  const dist=Math.max(size.x, size.z)/(2*Math.tan(fov/2));
  const dir=new THREE.Vector3(0.35, 0.85, 0.72).normalize();
  camera.position.copy(center).add(dir.multiplyScalar(dist*1.05+size.y));
  controls.target.set(center.x, 1.1, center.z);
  controls.update();
  const fitBtn=$('zoomFit'); if(fitBtn) fitBtn.classList.add('on');
}
function zoomBy(factor){
  cam.mode='free';
  const fitBtn=$('zoomFit'); if(fitBtn) fitBtn.classList.remove('on');
  const offset=camera.position.clone().sub(controls.target);
  if(offset.lengthSq()<1e-12) offset.set(0.01,0.01,0.01);
  offset.multiplyScalar(factor);
  camera.position.copy(controls.target).add(offset);
  controls.update();
}
function zoomToTeam(team){
  cam.mode='free'; camMode='orbit';
  const fitBtn=$('zoomFit'); if(fitBtn) fitBtn.classList.remove('on');
  const members=Object.values(deskSlots).filter(s=>s.team===team);
  if(team===(st.groups[SUPERVISOR]||'') && !members.length){
    controls.target.set(tinkerSeat.x,1.2,tinkerSeat.z);
    camera.position.set(tinkerSeat.x+6,8,tinkerSeat.z+7);
    controls.update(); return;
  }
  if(!members.length){ fitCamera(); return; }
  const x=members.reduce((t,p)=>t+p.seatX,0)/members.length;
  const z=members.reduce((t,p)=>t+p.seatZ,0)/members.length;
  controls.target.set(x,1,z);
  camera.position.set(x+6,8,z+7);
  controls.update();
}
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  if(!w||!h||!renderer) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  if(cam.mode==='fit' && world && world.children.length) fitCamera();
}

function bindUI(){
  $('left').addEventListener('click', (e)=>{
    const sec=e.target.closest('.sec');
    if(sec){ const body=sec.nextElementSibling; sec.classList.toggle('collapsed'); if(body) body.classList.toggle('collapsed'); return; }
    const fr=e.target.closest('.floor-row');
    if(fr){ selectedTeam=fr.getAttribute('data-team'); renderPanels(); zoomToTeam(selectedTeam); return; }
    const fin=e.target.closest('.fin-row');
    if(fin){ const chat=fin.getAttribute('data-chat'); if(chat) location.href=chat; }
  });
  $('botCards').addEventListener('click', (e)=>{
    const card=e.target.closest('.bot-card'); if(!card) return;
    const chat=card.getAttribute('data-chat'); if(chat) location.href=chat;
  });
  $('zoomIn').addEventListener('click', (e)=>{ e.stopPropagation(); zoomBy(0.8); });
  $('zoomOut').addEventListener('click', (e)=>{ e.stopPropagation(); zoomBy(1.25); });
  $('zoomFit').addEventListener('click', (e)=>{ e.stopPropagation(); selectedTeam=null; fitCamera(); renderPanels(); });
  $('camOrbit').addEventListener('click', ()=>{ camMode='orbit'; fitCamera(); });
  $('camTop').addEventListener('click', ()=>{
    camMode='top'; cam.mode='free';
    const box=new THREE.Box3().setFromObject(world);
    const c=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());
    const dist=Math.max(size.x, size.z)*0.85;
    camera.position.set(c.x, Math.max(dist, 1), c.z+0.02);
    controls.target.set(c.x,0,c.z);
    controls.update();
    $('zoomFit').classList.remove('on');
  });
  $('camFollow').addEventListener('click', ()=>{ camMode='follow'; cam.mode='free'; $('zoomFit').classList.remove('on'); });
  controls.addEventListener('start', ()=>{ cam.mode='free'; if(camMode==='follow') camMode='orbit'; $('zoomFit').classList.remove('on'); });
  canvas.addEventListener('wheel', ()=>{ cam.mode='free'; $('zoomFit').classList.remove('on'); }, {passive:true});
  const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
  let down=null;
  canvas.addEventListener('pointerdown', (e)=>{ down={x:e.clientX,y:e.clientY}; });
  canvas.addEventListener('pointerup', (e)=>{
    if(!down) return;
    const moved=Math.hypot(e.clientX-down.x, e.clientY-down.y); down=null;
    if(moved>6) return;
    const r=canvas.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1;
    mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse, camera);
    const hits=ray.intersectObjects(Object.values(agents).map(a=>a.group), true);
    if(!hits.length) return;
    let o=hits[0].object;
    while(o.parent && o.parent!==actorRoot) o=o.parent;
    const bot=Object.values(agents).find(a=>a.group===o);
    if(bot) selectedName=bot.name;
  });
  window.addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(stage);
  window.addEventListener('hashchange', ()=>{ if(!DEMO) load(); });
}

  {event:'message',time:NOW_S-599,message:JSON.stringify({chat:{Tinker:'grokbot://app/v1/agent?id=demo-tinker',Scout:'grokbot://app/v1/agent?id=demo-scout','E3A Fixer':'grokbot://app/v1/agent?id=demo-fixer'}})},

async function load(){
  const seq=++loadSeq;
  $('clock').textContent=nyClock();
  if(DEMO){
    hideMsg();
    ingestLines(DEMO_FEED.map(x=>JSON.stringify(x)));
    $('liveLabel').textContent='Demo';
    $('liveDot').style.background='#2a5278';
    render();
    return;
  }
  const topic=topicNow();
  if(!topic){
    showMsg('Add your channel to the address', 'Open this file with #<your channel> at the end of the address, like a password. Do not share that link.');
    $('liveLabel').textContent='Offline';
    $('liveDot').style.background='#8a8175';
    resetState(); render(); return;
  }
  if(!st.roster.length) render();
  try{
    const r=await fetch('https://ntfy.sh/'+encodeURIComponent(topic)+'/json?poll=1&since=12h');
    if(seq!==loadSeq) return;
    if(!r.ok) throw new Error('bad status '+r.status);
    const text=await r.text();
    if(seq!==loadSeq) return;
    const lines=text.trim()?text.trim().split('\n'):[];
    ingestLines(lines);
    hideMsg();
    $('liveLabel').textContent='Live';
    $('liveDot').style.background='#2f7d5a';
    render();
  }catch(e){
    if(seq!==loadSeq) return;
    showMsg('Could not reach the feed', 'Retrying every 30 seconds…');
    $('liveLabel').textContent='Retrying';
    $('liveDot').style.background='#c4842a';
  }
}

let lastT=performance.now(), lastLogic=0;
const followVec=new THREE.Vector3();
function frame(t){
  const dt=Math.min(0.08, Math.max(0,(t-lastT)/1000));
  lastT=t;
  if(world){
    if(t-lastLogic>150){
      lastLogic=t;
      const now=performance.now();
      ensureWorld();
      syncActors();
      updateIdlePlans(now);
      routeWorkers();
      tinkerTick(now);
      updateCards(now);
      updateMonitors();
    }
    for(const n in agents){
      stepAgent(agents[n], dt);
      pose(agents[n], dt, t);
    }
    animateCards();
    placeBubbles();
  }
  if(camMode==='follow'){
    const bot=agents[selectedName]||agents[SUPERVISOR]||Object.values(agents)[0];
    if(bot){
      const p=bot.group.position;
      controls.target.lerp(followVec.set(p.x,1.3,p.z), 0.08);
      camera.position.lerp(new THREE.Vector3(p.x+6, 7.5, p.z+7), 0.06);
    }
  }
  if(controls) controls.update();
  if(renderer && scene && camera) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

};
load();
requestAnimationFrame(frame);
setInterval(load, 30000);
setInterval(()=>{ $('clock').textContent=nyClock(); }, 15000);
